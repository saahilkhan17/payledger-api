services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payledger}
      POSTGRES_DB: ${POSTGRES_DB:-payledger}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payledger}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-payledger}:${POSTGRES_PASSWORD:-payledger}@postgres:5432/${POSTGRES_DB:-payledger}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENABLE_SCHEDULER: "true"
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
